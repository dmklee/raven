name: robomimic_basic

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      # type default: low_dim
    robot0_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [2]
  action: 
    shape: [10]

dataset_type: &dataset_type ph
abs_action: &abs_action True

env_runner:
  _target_: uferl.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: ${data.dataset_path}
  shape_meta: *shape_meta
  # costs 1GB per env
  n_train: 0
  n_train_vis: 0
  train_start_idx: 0
  n_test: 25
  n_test_vis: 2
  test_start_seed: 100000
  # use python's eval function as resolver, single-quoted string as argument
  max_steps: ${eval:'500 if "${task.dataset_type}" == "mh" else 400'}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'robot0_eye_in_hand_image'
  fps: 10
  crf: 22
  past_action: False
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 25
# evaluation at this config requires a 16 core 64GB instance.
